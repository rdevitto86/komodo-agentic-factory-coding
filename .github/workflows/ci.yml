name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up python3 for the hooks
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install config (symlinks scripts/validate.sh checks for)
        run: |
          mkdir -p "$HOME/.claude"
          for entry in claude-code/*; do
            name="$(basename "$entry")"
            ln -s "$PWD/$entry" "$HOME/.claude/$name"
          done

      - name: test-hooks.sh
        run: bash scripts/test-hooks.sh

      - name: validate.sh
        run: bash scripts/validate.sh
