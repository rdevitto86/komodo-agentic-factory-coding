name: Windows hook dispatch

on:
  push:
    branches: [main]
  pull_request:

jobs:
  git-bash-dispatch:
    name: test-hooks.sh (Git Bash)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.x"
      - name: Run hook regression suite via Git Bash
        shell: bash
        run: bash scripts/test-hooks.sh

  powershell-dispatch:
    name: hooks (PowerShell fallback)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: comment_guard.py flags an unallowed added comment
        shell: pwsh
        run: |
          $payload = @{
            hook_event_name = "PreToolUse"
            tool_name = "Edit"
            tool_input = @{
              file_path = "example.go"
              old_string = "func add(a, b int) int {`n`treturn a + b`n}"
              new_string = "// increments the running total`nfunc add(a, b int) int {`n`treturn a + b`n}"
            }
          } | ConvertTo-Json -Depth 10

          $out = $payload | python claude-code/hooks/comment_guard.py
          Write-Host $out
          $decision = ($out | ConvertFrom-Json).hookSpecificOutput.permissionDecision
          if ($decision -ne "ask") {
            Write-Error "expected comment_guard.py to ask about an unallowed added comment, got decision=$decision"
            exit 1
          }

      - name: git_guard.py denies an in-place rewrite
        shell: pwsh
        run: |
          $payload = @{
            hook_event_name = "PreToolUse"
            tool_name = "Bash"
            tool_input = @{
              command = "git commit --amend -m 'rewrite'"
            }
          } | ConvertTo-Json -Depth 10

          $out = $payload | python claude-code/hooks/git_guard.py
          Write-Host $out
          $decision = ($out | ConvertFrom-Json).hookSpecificOutput.permissionDecision
          if ($decision -ne "deny") {
            Write-Error "expected git_guard.py to deny an in-place rewrite, got decision=$decision"
            exit 1
          }
