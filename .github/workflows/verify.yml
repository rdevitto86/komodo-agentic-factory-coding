name: verify

# Tiered by cost: Linux on everything, Windows on merges, macOS (10x billing) only on the weekly sweep.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.9"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Only this tier carries a toolchain, so only here can verify rebuild the hook binaries and prove they match.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache-dependency-path: komodo/adapters/claude/hooks/guard/go.mod
      - name: configure git identity for the test repos
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          git config --global init.defaultBranch main
      - name: verify
        run: python scripts/verify.py

  windows:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: configure git identity for the test repos
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          git config --global init.defaultBranch main
      - name: verify
        run: python scripts/verify.py

  macos:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: configure git identity for the test repos
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          git config --global init.defaultBranch main
      - name: verify
        run: python scripts/verify.py
